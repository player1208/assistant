<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>屏幕信息测试</title>
</head>
<body>
  <script>
    alert(
      "CSS宽度: " + window.innerWidth + "px\n" +
      "DPR: " + window.devicePixelRatio + "\n" +
      "物理宽度约: " + (window.innerWidth * window.devicePixelRatio) + "px"
    );
  </script>
</body>
</html>
